name: Update README
on:
  push:
    branches:
      - main
  schedule:
    - cron: '*/30 0 * * *'
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: checkout repo
        uses: actions/checkout@v2
        with:
          fetch-depth: 0
      - name: Update AC's blog posts
        uses: gautamkrishnar/blog-post-workflow@master
        with:
          readme_path: ./profile/README.md
          feed_list: "https://www.andrewconnell.com/articles/rss.xml"
          comment_tag_name: "ANDREWCONNELLBLOG-POST-LIST"
          commit_message: "🤖♻️ Update README with AC's latest blog posts"
          max_post_count: "10"
          date_format: "mmm d, yyyy"
          template: '$newline- $date - [$title]($url)'
